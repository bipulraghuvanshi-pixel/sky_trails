name: sky_trails
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  http: ^1.2.1
  country_flags: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/app_icon/sky_trails_icon.png"

  macos:
    generate: true
    image_path: "assets/app_icon/sky_trails_icon.png"

  windows:
    generate: true
    image_path: "assets/app_icon/sky_trails_icon.png"

  web:
    generate: true
    image_path: "assets/app_icon/sky_trails_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/app_icon/